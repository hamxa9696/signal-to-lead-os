services:
  db:
    # Plain Postgres 16 — same major version as Supabase, so migrations port as-is.
    image: postgres:16
    container_name: stl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: stl
      POSTGRES_DB: stl
    ports:
      - "5434:5432" # 5434 avoids clashing with other local Postgres instances
    volumes:
      - stl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl -d stl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stl_pgdata:
